<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Marka yang sama dengan apple-touch-icon.png: tiga batang mendatar,
       bahasa visual "daftar catatan". Warna ikut tema sistem supaya ikon tab
       tidak jadi kotak gelap di antara tab terang, atau sebaliknya. -->
  <style>
    .latar { fill: #34506B }
    .tinta { fill: #EDE7DA }
    @media (prefers-color-scheme: dark) {
      .latar { fill: #8FB3D4 }
      .tinta { fill: #1A1815 }
    }
  </style>
  <rect class="latar" width="180" height="180" rx="38"/>
  <g class="tinta">
    <rect x="40" y="56"  width="100" height="16" rx="8"/>
    <rect x="40" y="86"  width="68"  height="16" rx="8"/>
    <rect x="40" y="116" width="84"  height="16" rx="8"/>
  </g>
</svg>
